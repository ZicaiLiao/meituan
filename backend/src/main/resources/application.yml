server:
  port: 8080

spring:
  application:
    name: meituan-backend
  datasource:
    url: ${MEITUAN_DB_URL:jdbc:mysql://localhost:3306/meituan_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${MEITUAN_DB_USERNAME:root}
    password: ${MEITUAN_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${MEITUAN_REDIS_HOST:localhost}
      port: ${MEITUAN_REDIS_PORT:6379}
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true

rocketmq:
  name-server: ${MEITUAN_ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: meituan-demo-producer

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
  type-aliases-package: com.meituan.demo.backend.persistence

meituan:
  security:
    jwt-secret: ${MEITUAN_JWT_SECRET:meituan-demo-super-secret-key-meituan-demo-super-secret-key}
    access-token-minutes: ${MEITUAN_JWT_ACCESS_MINUTES:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
