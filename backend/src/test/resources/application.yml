spring:
  datasource:
    url: jdbc:mysql://localhost:3306/meituan_demo_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

rocketmq:
  name-server: localhost:9876

meituan:
  security:
    jwt-secret: meituan-demo-super-secret-key-meituan-demo-super-secret-key
    access-token-minutes: 180
