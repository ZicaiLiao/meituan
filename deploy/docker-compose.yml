services:
  mysql:
    image: mysql:8.4
    container_name: meituan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meituan_demo
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7.2
    container_name: meituan-redis
    ports:
      - "6379:6379"

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.1
    container_name: meituan-rmq-nameserver
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: meituan-rmq-broker
    depends_on:
      - rocketmq-nameserver
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker -n rocketmq-nameserver:9876 --enable-proxy
    ports:
      - "10911:10911"
      - "10909:10909"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: meituan-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: meituan-backend
    depends_on:
      - mysql
      - redis
      - rocketmq-nameserver
      - rocketmq-broker
      - elasticsearch
    environment:
      MEITUAN_DB_URL: jdbc:mysql://mysql:3306/meituan_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      MEITUAN_DB_USERNAME: root
      MEITUAN_DB_PASSWORD: root
      MEITUAN_REDIS_HOST: redis
      MEITUAN_REDIS_PORT: 6379
      MEITUAN_ROCKETMQ_NAME_SERVER: rocketmq-nameserver:9876
    ports:
      - "8080:8080"

  netty-gateway:
    build:
      context: ..
      dockerfile: netty-gateway/Dockerfile
    container_name: meituan-netty-gateway
    depends_on:
      - backend
    ports:
      - "9000:9000"

  user-h5:
    build:
      context: ../apps/user-h5
      dockerfile: Dockerfile
    container_name: meituan-user-h5
    depends_on:
      - backend
    ports:
      - "5173:5173"

  merchant:
    build:
      context: ../apps/merchant
      dockerfile: Dockerfile
    container_name: meituan-merchant
    depends_on:
      - backend
    ports:
      - "5174:5174"

  rider:
    build:
      context: ../apps/rider
      dockerfile: Dockerfile
    container_name: meituan-rider
    depends_on:
      - backend
    ports:
      - "5175:5175"

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    container_name: meituan-admin
    depends_on:
      - backend
    ports:
      - "5176:5176"

networks:
  default:
    name: meituan-network
