brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
listenPort=10911
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
namesrvAddr=rocketmq-nameserver:9876

# Advertise a host-resolvable address so both host-run processes and Compose containers
# can consume route info returned by the nameserver.
brokerIP1=host.docker.internal
